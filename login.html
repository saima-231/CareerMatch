<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerMatch - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryDark: '#091D3E',
                        primary: '#06B6D4',
                        secondary: '#67E8F9',
                        cream: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-primaryDark text-cream min-h-screen flex items-center justify-center">

    <!-- Background Glow (same style as your landing page) -->
    <div class="absolute w-72 h-72 bg-primary/20 blur-3xl rounded-full top-10 left-10"></div>
    <div class="absolute w-72 h-72 bg-secondary/10 blur-3xl rounded-full bottom-10 right-10"></div>

    <!-- LOGIN CARD -->
    <div class="w-full max-w-md bg-slate-900/70 backdrop-blur-lg border border-cyan-900 rounded-3xl p-8 relative">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="w-14 h-14 mx-auto rounded-2xl bg-primary flex items-center justify-center">
                <span class="font-bold text-primaryDark text-xl">CM</span>
            </div>

            <h1 class="text-2xl font-bold mt-4">
                Career<span class="text-primary">Match</span>
            </h1>

            <p class="text-slate-400 text-sm mt-2">
                Login to continue
            </p>

        </div>

        <!-- FORM -->
        <form class="space-y-5">

            <!-- Role -->
            <div>
                <label class="text-sm text-slate-300">Select Role</label>
                <select
                    class="w-full mt-2 px-4 py-3 rounded-xl bg-slate-800 border border-cyan-900 focus:border-primary outline-none">
                    <option>Student</option>
                    <option>Company</option>
                    <option>Admin</option>
                </select>
            </div>

            <!-- Email -->
            <div>
                <label class="text-sm text-slate-300">Email</label>
                <input type="email" placeholder="Enter email"
                    class="w-full mt-2 px-4 py-3 rounded-xl bg-slate-800 border border-cyan-900 focus:border-primary outline-none text-white" />
            </div>

            <!-- Password -->
            <div>
                <label class="text-sm text-slate-300">Password</label>
                <input type="password" placeholder="Enter password"
                    class="w-full mt-2 px-4 py-3 rounded-xl bg-slate-800 border border-cyan-900 focus:border-primary outline-none text-white" />
            </div>

            <!-- Options -->
            <div class="flex justify-between items-center text-sm text-slate-400">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-primary">
                    Remember Me
                </label>

                <a href="#" class="text-primary hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Button -->
            <button
                class="w-full bg-primary text-primaryDark font-semibold py-3 rounded-xl hover:bg-secondary transition">
                Login
            </button>

        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-1 h-px bg-slate-700"></div>
            <span class="px-3 text-slate-500 text-sm">OR</span>
            <div class="flex-1 h-px bg-slate-700"></div>
        </div>

        <!-- Google -->
        <button class="w-full bg-white text-black font-medium py-3 rounded-xl hover:bg-gray-100 transition">
            Continue with Google
        </button>

        <!-- Register -->
        <p class="text-center text-slate-400 text-sm mt-6">
            Don’t have an account?
            <a href="#" class="text-primary hover:underline font-medium">Register</a>
        </p>

    </div>

</body>

</html>
